<section id="sobre" class="secao--clara sobre">
  <div class="container">
    <div class="sobre_grid">
      <div appReveal>
        <span class="rotulo">Objetivo</span>
        <p class="paragrafo-lead">{{ objetivo }}</p>
      </div>

      <dl class="sobre_fatos" appReveal>
        <div class="sobre_fato" *ngFor="let fato of fatos">
          <dt>{{ fato.rotulo }}</dt>
          <dd>{{ fato.valor }}</dd>
        </div>
      </dl>
    </div>

    <!-- Faixa de redes/contato, logo abaixo do objetivo -->
    <!-- Faixa de redes/contato estilizada estilo Stack/Glifo -->
    <div class="sobre_redes" appReveal>
      <span class="rotulo">Redes &amp; contato</span>
      <div class="sobre_redes-grid">
        <a class="sobre_rede-card" *ngFor="let rede of redes" [href]="rede.href"
          [attr.target]="rede.externo ? '_blank' : null" [attr.rel]="rede.externo ? 'noopener' : null">
          <span class="sobre_rede-glifo">
            <i [class]="rede.iconeClass"></i>
          </span>
          <span class="sobre_rede-nome">{{ rede.rotulo }}</span>
        </a>
      </div>
    </div>
  </div>
</section>
