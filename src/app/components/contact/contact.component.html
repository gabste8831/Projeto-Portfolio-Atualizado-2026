<section id="contato" class="secao--clara contato">
  <div class="container contato__conteudo" appReveal>
    <h2 class="contato__titulo">Vamos construir o próximo <em>capítulo</em>, juntos.</h2>
    <p class="paragrafo-lead contato__texto">
      Aberto a oportunidades como desenvolvedor Full Stack - de APIs e ETL a interfaces e infraestrutura.
    </p>

    <div class="contato__links">
      <a class="botao botao--primario" href="mailto:{{ perfil.email }}">{{ perfil.email }}</a>
      <a class="botao botao--link" href="tel:{{ perfil.telefone }}">{{ perfil.telefone }}</a>
    </div>

    <div class="contato__redes">
      <a [href]="perfil.linkedin" target="_blank" rel="noopener">LinkedIn</a>
      <a [href]="perfil.github" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</section>
