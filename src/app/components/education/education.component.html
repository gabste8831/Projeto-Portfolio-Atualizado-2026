<section id="formacao" class="secao--clara formacao">
  <div class="container formacao_grid">
    <div appReveal>
      <span class="rotulo">Formação</span>
      <h2 class="titulo-secao">Base acadêmica &amp; aprendizado contínuo</h2>

      <ul class="formacao_lista">
        <li class="formacao_item" *ngFor="let item of formacao">
          <h3>{{ item.titulo }}</h3>
          <p>{{ item.instituicao }}</p>
          <p class="texto-secundario">{{ item.periodo }}</p>
        </li>
      </ul>
    </div>

    <div appReveal>
      <span class="rotulo">Cursos &amp; certificações</span>
      <ul class="cursos_lista">
        <li class="cursos_item" *ngFor="let curso of cursos">
          <div class="cursos_cabecalho">
            <h3>{{ curso.titulo }}</h3>
            <span>{{ curso.periodo }}</span>
          </div>
          <p>{{ curso.instituicao }} - {{ curso.descricao }}</p>
        </li>
      </ul>
      <div class="botao--outline">
        <a [href]="perfil.linkedin" target="_blank" rel="noopener">Ver mais</a>
      </div>
    </div>
  </div>
</section>
