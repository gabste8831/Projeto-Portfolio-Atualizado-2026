<header id="topo" class="hero">
  <div class="container hero_grid">
    <div class="hero_copy" appReveal>
      <span class="rotulo">Rio do Sul, SC - {{ perfil.idade }} anos</span>
      <h1 class="hero_titulo">
        Desenvolvedor<br><em>de Software</em>
      </h1>

      @for (paragrafo of perfil.resumo; track paragrafo) {
      <p class="hero_resumo">{{ paragrafo }}</p>
      }

      <!-- Todos os botões integrados no mesmo ecossistema flex -->
      <div class="hero_cta">
        <a class="botao botao--outline" href="assets/gabriel-steffens-curriculo.pdf"
          download="Curriculo_Gabriel_Steffens.pdf">
          Currículo (PDF)
        </a>
        <a class="botao botao--link" [href]="perfil.github" target="_blank" rel="noopener">GitHub</a>
        <a class="botao botao--link" [href]="perfil.linkedin" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>

    <div class="hero_photo-wrap" appReveal>
      <div class="hero_frame"></div>
      <figure class="hero_photo">
        <img src="/gabriel.jpg" alt="Foto de {{ perfil.nome }}" width="1000" height="400" />
        <figcaption>{{ perfil.nome }}</figcaption>
      </figure>
    </div>
  </div>
</header>
