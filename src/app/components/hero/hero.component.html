<header id="topo" class="hero">
  <div class="container hero__grid">
    <div class="hero__copy" appReveal>
      <span class="rotulo">Rio do Sul, SC — {{ perfil.idade }} anos</span>
      <h1 class="hero__titulo">
        Desenvolvedor <em>Full&nbsp;Stack</em>,<br />
        com raiz em dados.
      </h1>
      <p class="hero__resumo">{{ perfil.resumo }}</p>

      <div class="hero__cta">
        <a class="botao botao--primario" href="mailto:{{ perfil.email }}">Falar comigo</a>
        <a class="botao botao--link" [href]="perfil.github" target="_blank" rel="noopener">GitHub</a>
        <a class="botao botao--link" [href]="perfil.linkedin" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>

    <div class="hero__photo-wrap" appReveal>
      <div class="hero__frame"></div>
      <figure class="hero__photo">
        <img src="/gabriel.jpg" alt="Foto de {{ perfil.nome }}" width="1080" height="1080" />
        <figcaption>{{ perfil.nome }} — {{ perfil.cargoObjetivo }}</figcaption>
      </figure>
    </div>
  </div>
</header>
