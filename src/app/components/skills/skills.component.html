<section id="skills" class="secao--clara skills">
  <div class="container">
    <span class="rotulo" appReveal>Caixa de ferramentas</span>
    <h2 class="titulo-secao" appReveal>Skills &amp; <em>stacks</em></h2>

    <div class="skills_carrossel" appReveal>

      <!-- 1. CONTAINER DA INTERFACE (Segura as setas e a janela central) -->
      <div class="skills_carrossel-interface">
        <button type="button" class="skills_seta skills_seta--esquerda" (click)="anterior()"
          aria-label="Categoria anterior">‹</button>

        <!-- 2. VIEWPORT (Janela estática que mascara o conteúdo excedente) -->
        <div class="skills_viewport" #viewport (touchstart)="aoTocarInicio($event)" (touchmove)="aoTocarMover($event)"
          (touchend)="aoTocarFim()" (touchcancel)="aoTocarFim()">

          <!-- 3. TRILHO (A esteira móvel que realmente desliza horizontalmente) -->
          <div class="skills_trilho" [class.sem-transicao]="arrastando()"
            [style.transform]="'translateX(' + deslocamento() + '%)'">

            <!-- Cada slide agora encapsula o Título + Seus respectivos Logotipos -->
            <div class="skills_slide" *ngFor="let grupo of grupos">

              <!-- O título agora faz parte do slide e desliza junto com os blocos -->
              <h3 class="skills_categoria">{{ grupo.categoria }}</h3>

              <div class="logotipos">
                <div class="logotipo" *ngFor="let item of grupo.itens">
                  <span class="logotipo_glifo">
                    <img *ngIf="temIcone(item)" [src]="iconeUrl(item)" [alt]="item" class="logotipo_icone"
                      loading="lazy" (error)="aoErrarIcone(item)" />
                    <span class="logotipo_monograma" *ngIf="!temIcone(item)">{{ sigla(item) }}</span>
                  </span>
                  <span class="logotipo_nome">{{ item }}</span>
                </div>
              </div>

            </div>

          </div>

        </div>

        <button type="button" class="skills_seta skills_seta--direita" (click)="proximo()"
          aria-label="Próxima categoria">›</button>
      </div>

      <!-- Pontos de progresso inferiores (mantidos para navegação discreta) -->
      <div class="skills_pontos">
        <button type="button" class="skills_ponto" *ngFor="let grupo of grupos; let i = index"
          [class.skills_ponto--ativo]="i === indiceAtivo()" (click)="irPara(i)"
          [attr.aria-label]="'Ir para ' + grupo.categoria"></button>
      </div>
    </div>

    <!-- Soft skills (Sem alterações) -->
    <div class="skills_soft" appReveal>
      <h3 class="skills_categoria">Engenharia &amp; gestão</h3>
      <ul class="skills_soft-itens">
        <li *ngFor="let skill of softSkills">{{ skill }}</li>
      </ul>
    </div>
  </div>
</section>
